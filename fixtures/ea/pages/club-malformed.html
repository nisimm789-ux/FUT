<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Club - FC Web App (synthetic fixture)</title>
</head>
<body>
<div class="ut-root-view" data-fixture-profile="synthetic-v1">
<nav class="ut-tab-bar" aria-label="fixture navigation"></nav>
<main class="ut-content">
<section class="ut-view ut-club-items-view">
  <header class="ut-view-header"><h1>Club Players</h1></header>
  <ul class="ut-item-list" data-location="club" data-complete="true">
    <li class="ut-list-item" data-item-id="it-0001">
      <div class="ut-item player common untradeable">
        <span class="ut-item-rating">161</span>
        <span class="ut-item-position" data-position="ST">ST</span>
        <span class="ut-item-name">Synthetic Player 01</span>
        
        <img class="ut-item-nation" alt="" src="../site/img/flags/54.png">
        <img class="ut-item-league" alt="" src="../site/img/leagues/53.png">
        <img class="ut-item-club" alt="" src="../site/img/clubs/243.png">
      </div>
    </li>
    <li class="ut-list-item" data-item-id="it-0002">
      <div class="ut-item player common untradeable">
        <span class="ut-item-rating">71</span>
        <span class="ut-item-position" data-position="ST">ST</span>
        <span class="ut-item-name">Synthetic Player 02</span>
        <img class="ut-item-portrait" alt="" src="../site/img/players/900002.png">
        <img class="ut-item-nation" alt="" src="../site/img/flags/52.png">
        <img class="ut-item-league" alt="" src="../site/img/leagues/53.png">
        <img class="ut-item-club" alt="" src="../site/img/clubs/240.png">
      </div>
    </li>
    <li class="ut-list-item" data-item-id="it-0003">
      <div class="ut-item player common untradeable">
        <span class="ut-item-rating">83</span>
        <span class="ut-item-position" data-position="RW">RW</span>
        <span class="ut-item-name">Synthetic Player 03</span>
        <img class="ut-item-portrait" alt="" src="../site/img/players/900003.png">
        <img class="ut-item-nation" alt="" src="../site/img/flags/52.png">
        <img class="ut-item-league" alt="" src="../site/img/leagues/31.png">
        <img class="ut-item-club" alt="" src="../site/img/clubs/45.png">
      </div>
    </li>
  </ul>
  <h2>SBC Storage</h2>
  <ul class="ut-item-list" data-location="sbc-storage" data-complete="true">

  </ul>
</section>
</main>
</div>
</body>
</html>
