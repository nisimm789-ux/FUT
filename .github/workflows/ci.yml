name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:extension
      # Dev tooling must not depend on NODE_ENV: build the dev variant with NODE_ENV=production.
      - run: pnpm build:extension:dev
        env:
          NODE_ENV: production
      - run: pnpm verify:builds
